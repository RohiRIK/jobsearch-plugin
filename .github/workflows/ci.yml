name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        env:
          # Chromium's documented SUID helper keeps sandboxing on under Ubuntu's
          # restricted user namespaces; never use --no-sandbox or disable AppArmor.
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: |
          test -u "$CHROME_DEVEL_SANDBOX"
          bun test tests/