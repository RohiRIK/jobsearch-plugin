name: Personal data

# Blocks real emails, phone numbers and LinkedIn URLs from reaching the repo.
# It never rewrites a commit: a sanitiser that edits your work behind your
# back is a change nobody reviews. Placeholders go in the scanner's allow-list.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the point is to catch a blob reintroduced by a bad
          # force-push or a merge, which a shallow clone cannot see.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scan tracked files
        run: bun run scripts/scan-personal-data.ts

      - name: Scan full history
        run: bun run scripts/scan-personal-data.ts --history