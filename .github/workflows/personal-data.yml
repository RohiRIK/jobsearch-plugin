name: Personal data

# This repo's whole job is handling one person's CV, so personal data is always
# one careless `git add -A` from being committed. Two files carrying a real
# email, phone and LinkedIn URL reached the history that way and needed a full
# rewrite to remove. The repo is private today, but visibility flips in two
# clicks and clones outlive it.
# This check BLOCKS; it never rewrites. A sanitiser that edits your commit
# behind your back is a change nobody reviews.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the point is to catch a blob reintroduced by a bad
          # force-push or a merge, which a shallow clone cannot see.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scan tracked files
        run: bun run scripts/scan-personal-data.ts

      - name: Scan full history
        run: bun run scripts/scan-personal-data.ts --history