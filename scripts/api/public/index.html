<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Design tokens (utilitarian/dense · sharp stance · slate-indigo + amber) ── */
  :root {
    --font-display: "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;

    --surface: oklch(0.985 0.005 260);
    --raised:  oklch(0.958 0.008 260);
    --border:  oklch(0.885 0.012 260);
    --muted:   oklch(0.44 0.02 260);
    --text:    oklch(0.28 0.025 260);
    --display: oklch(0.20 0.03 260);
    --primary: oklch(0.40 0.11 260);
    --accent:  oklch(0.44 0.13 72);   /* amber — the single signature, ~5% of paint */
    --accent-soft: oklch(0.92 0.05 78);
    --good:    oklch(0.42 0.10 155);
    --bad:     oklch(0.47 0.13 25);

    --radius: 2px;
    --dur: 130ms;
    --ease: ease-out;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: oklch(0.17 0.012 260);
      --raised:  oklch(0.21 0.015 260);
      --border:  oklch(0.30 0.02 260);
      --muted:   oklch(0.70 0.02 260);
      --text:    oklch(0.82 0.02 260);
      --display: oklch(0.93 0.02 260);
      --primary: oklch(0.66 0.12 260);
      --accent:  oklch(0.78 0.13 78);
      --accent-soft: oklch(0.30 0.06 78);
      --good:    oklch(0.72 0.11 155);
      --bad:     oklch(0.70 0.14 25);
    }
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--surface);
    padding: clamp(1.25rem, 3vw, 2.5rem);
    max-width: 1180px;
    margin-inline: auto;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.25rem, 2.4vw, 1.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--display);
  }
  h1 .dot { color: var(--accent); }
  .updated { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }

  h2 {
    font-family: var(--font-display);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }

  /* ── Stat grid ── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .stat { background: var(--surface); padding: 0.9rem 1rem; transition: background var(--dur) var(--ease); }
  .stat:hover { background: var(--raised); }
  .stat b {
    display: block;
    font-family: var(--font-mono);
    font-size: 1.7rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--display);
    line-height: 1.1;
  }
  .stat.lead b { color: var(--accent); }
  .stat span { display: block; margin-top: 0.25rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  /* ── Kanban board ── */
  .board { display: flex; gap: 0.75rem; overflow-x: auto; align-items: flex-start; padding-bottom: 0.5rem; }
  .col { flex: 1 0 190px; min-width: 190px; }
  .col-head { display: flex; align-items: center; justify-content: space-between; padding: 0.35rem 0.5rem; border-bottom: 2px solid var(--border); margin-bottom: 0.5rem; }
  .col-head h3 { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .col-head .n { font-family: var(--font-mono); font-size: 0.72rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .col.is-offered .col-head { border-bottom-color: var(--good); }
  .col.is-offered .col-head h3, .col.is-offered .col-head .n { color: var(--good); }
  .col.is-rejected .col-head, .col.is-withdrawn .col-head { border-bottom-color: color-mix(in oklch, var(--bad) 45%, var(--border)); }

  .app {
    background: var(--raised);
    border: 1px solid var(--border);
    border-left: 2px solid var(--primary);
    border-radius: var(--radius);
    padding: 0.55rem 0.65rem;
    margin-bottom: 0.5rem;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .app:hover { border-left-color: var(--accent); }
  .app .co { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .app .ro { font-size: 0.78rem; color: var(--muted); }
  .app small { display: block; margin-top: 0.2rem; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); }
  .col.is-offered .app { border-left-color: var(--good); }

  .empty { color: var(--muted); font-size: 0.78rem; padding: 0.4rem 0.5rem; }

  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; border: 1px solid var(--border); }
  thead th {
    text-align: left; padding: 0.5rem 0.7rem;
    font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); background: var(--raised); border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border); }
  tbody tr { transition: background var(--dur) var(--ease); }
  tbody tr:hover { background: var(--raised); }
  tbody tr:last-child td { border-bottom: 0; }
  td.mono { font-family: var(--font-mono); font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .tag { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.05rem 0.35rem; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px; }

  #error { color: var(--bad); font-family: var(--font-mono); font-size: 0.8rem; padding: 0.75rem; border: 1px solid var(--bad); border-radius: var(--radius); margin: 1rem 0; display: none; }

  /* ── Motion (intensity ~2: entrance once, hover feedback only) ── */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  main > * { animation: rise 260ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  main > *:nth-child(2) { animation-delay: 40ms; }
  main > *:nth-child(3) { animation-delay: 80ms; }
  main > *:nth-child(4) { animation-delay: 120ms; }
  @media (prefers-reduced-motion: reduce) { main > * { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Job Search <span class="dot">·</span> Pipeline</h1>
  <div class="updated" id="updated"></div>
</header>
<div id="error"></div>
<main>
  <section>
    <h2>Overview</h2>
    <div class="stats" id="stats"></div>
  </section>
  <section>
    <h2>Applications</h2>
    <div class="board" id="board"></div>
  </section>
  <section>
    <h2>New Scraped Jobs</h2>
    <table id="jobs"><thead><tr><th>Title</th><th>Company</th><th>Location</th><th>Market</th><th>First seen</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script>
const STATUSES = ["planning","applied","interviewing","offered","rejected","no_response","withdrawn"];
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
async function load() {
  try {
    const [analytics, apps, jobs] = await Promise.all([
      fetch("/api/analytics").then(r => r.json()),
      fetch("/api/applications").then(r => r.json()),
      fetch("/api/jobs?status=new").then(r => r.json()),
    ]);

    document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();

    const stats = document.getElementById("stats");
    const items = [
      ["Tracked", analytics.pipeline.total, false],
      ["Response rate", analytics.responseMetrics.responseRate ?? "—", false],
      ["Interview rate", analytics.responseMetrics.interviewRate ?? "—", false],
      ["Follow-ups due", analytics.pendingFollowups, true],
      ["New jobs", jobs.total, false],
      ["Reasoning notes", analytics.reasoningEntries, false],
    ];
    for (const [label, value, lead] of items) {
      const s = el("div", "stat" + (lead ? " lead" : ""));
      s.append(el("b", null, String(value)), el("span", null, label));
      stats.append(s);
    }

    const board = document.getElementById("board");
    for (const status of STATUSES) {
      const inStatus = apps.applications.filter(a => a.status === status);
      const col = el("div", "col is-" + status);
      const head = el("div", "col-head");
      head.append(el("h3", null, status.replace(/_/g, " ")), el("span", "n", String(inStatus.length)));
      col.append(head);
      if (inStatus.length === 0) col.append(el("div", "empty", "—"));
      for (const a of inStatus) {
        const card = el("div", "app");
        card.append(el("div", "co", a.company), el("div", "ro", a.role), el("small", null, a.date + (a.channel ? " · " + a.channel : "")));
        col.append(card);
      }
      board.append(col);
    }

    const tbody = document.querySelector("#jobs tbody");
    if (jobs.jobs.length === 0) {
      const tr = el("tr"); const td = el("td", "empty", 'No new jobs — run: bun run pipeline:scrape --query "…"'); td.colSpan = 5; tr.append(td); tbody.append(tr);
    }
    for (const j of jobs.jobs.slice(0, 50)) {
      const tr = el("tr");
      const title = el("td"); const link = el("a", null, j.title); link.href = j.url; link.target = "_blank"; link.rel = "noopener"; title.append(link);
      const market = el("td"); market.append(el("span", "tag", j.market));
      tr.append(title, el("td", null, j.company), el("td", null, j.location), market, el("td", "mono", j.first_seen));
      tbody.append(tr);
    }
  } catch (err) {
    const box = document.getElementById("error");
    box.style.display = "block";
    box.textContent = "Failed to load: " + err.message;
  }
}
load();
</script>
</body>
</html>
